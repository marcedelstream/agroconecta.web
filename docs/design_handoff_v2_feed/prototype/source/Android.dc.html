<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Agroconecta Android — Inicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700;8..144,800&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Roboto Flex",Roboto,system-ui,sans-serif;background:#0B1620;-webkit-font-smoothing:antialiased}
a{color:#A4D233}a:hover{color:#C6E878}
button{font-family:inherit;cursor:pointer}
.sc{position:absolute;left:0;top:0;width:390px;height:844px;overflow:hidden;--row:#9CC23E;--rowop:.32}
.sky{position:absolute;left:0;right:0;top:0;height:411px;background:linear-gradient(180deg,#1E3550 0%,#5E6B7E 40%,#D8905A 82%,#F4C27E 100%)}
.land{position:absolute;left:0;right:0;top:410px;bottom:0;background:linear-gradient(180deg,#6B7432 0%,#34521A 30%,#15260C 100%)}
.rows{position:absolute;left:0;top:410px;width:390px;height:434px}
.rows polygon{fill:var(--row);fill-opacity:var(--rowop)}
.sun{position:absolute;left:45px;top:250px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,228,168,.95) 0%,rgba(255,196,120,.45) 30%,rgba(255,170,90,0) 62%)}
.haze{position:absolute;left:0;right:0;top:350px;height:120px;background:linear-gradient(180deg,rgba(244,194,126,0),rgba(244,194,126,.55) 50%,rgba(244,194,126,0))}
.tonal{width:48px;height:48px;border-radius:24px;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:rgba(24,30,20,.62);color:#EEF5DC}
.cnt{font-size:12px;font-weight:500;color:#FFFFFF;letter-spacing:.02em}
.nb{flex:1;height:80px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;font-size:12px;font-weight:600;letter-spacing:.03em}
.ind{width:64px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B1620">
<div class="sc">
<div class="sky"></div>
<div class="land"></div>
<svg class="rows" viewBox="0 0 390 434" preserveAspectRatio="none" aria-hidden="true"><polygon points="24.6,0 29.9,0 -866,434 -900,434"></polygon><polygon points="35.8,0 41.1,0 -794,434 -828,434"></polygon><polygon points="47.0,0 52.3,0 -722,434 -756,434"></polygon><polygon points="58.2,0 63.5,0 -650,434 -684,434"></polygon><polygon points="69.4,0 74.7,0 -578,434 -612,434"></polygon><polygon points="80.6,0 85.9,0 -506,434 -540,434"></polygon><polygon points="91.8,0 97.1,0 -434,434 -468,434"></polygon><polygon points="103.0,0 108.3,0 -362,434 -396,434"></polygon><polygon points="114.2,0 119.5,0 -290,434 -324,434"></polygon><polygon points="125.4,0 130.7,0 -218,434 -252,434"></polygon><polygon points="136.6,0 141.9,0 -146,434 -180,434"></polygon><polygon points="147.8,0 153.1,0 -74,434 -108,434"></polygon><polygon points="159.0,0 164.3,0 -2,434 -36,434"></polygon><polygon points="170.3,0 175.5,0 70,434 36,434"></polygon><polygon points="181.5,0 186.8,0 142,434 108,434"></polygon><polygon points="192.7,0 198.0,0 214,434 180,434"></polygon><polygon points="203.9,0 209.2,0 286,434 252,434"></polygon><polygon points="215.1,0 220.4,0 358,434 324,434"></polygon><polygon points="226.3,0 231.6,0 430,434 396,434"></polygon><polygon points="237.5,0 242.8,0 502,434 468,434"></polygon><polygon points="248.7,0 254.0,0 574,434 540,434"></polygon><polygon points="259.9,0 265.2,0 646,434 612,434"></polygon><polygon points="271.1,0 276.4,0 718,434 684,434"></polygon><polygon points="282.3,0 287.6,0 790,434 756,434"></polygon><polygon points="293.5,0 298.8,0 862,434 828,434"></polygon><polygon points="304.7,0 310.0,0 934,434 900,434"></polygon><polygon points="315.9,0 321.2,0 1006,434 972,434"></polygon><polygon points="327.1,0 332.4,0 1078,434 1044,434"></polygon><polygon points="338.3,0 343.6,0 1150,434 1116,434"></polygon><polygon points="349.6,0 354.8,0 1222,434 1188,434"></polygon><polygon points="360.8,0 366.1,0 1294,434 1260,434"></polygon></svg>
<div class="sun"></div>
<div class="haze"></div>
</div>
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: linear-gradient(180deg,rgba(4,9,6,.45) 0%,rgba(4,9,6,0) 15%,rgba(4,9,6,0) 44%,rgba(4,9,6,.55) 64%,rgba(4,9,6,.92) 100%)"></div>

<div style="position: absolute; left: 16px; right: 12px; top: 44px; height: 56px; display: flex; align-items: center; justify-content: space-between">
<div style="font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: #FFFFFF"><span style="color: #A4D233">agro</span>conecta</div>
<button class="tonal" aria-label="Buscar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
</div>

<div style="position: absolute; right: 12px; bottom: 212px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<div style="position: relative; width: 52px; height: 62px; display: flex; justify-content: center">
<img src="/_blob/814d28a1457689209d847b561d1953e7" alt="Agroconecta Noticias" style="width: 52px; height: 52px; border-radius: 16px; border: 2px solid #FFFFFF; box-sizing: border-box">
<button aria-label="{{ followLabel }}" onClick="{{ follow }}" style="position: absolute; left: 14px; bottom: 0; width: 24px; height: 24px; border-radius: 8px; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: {{ followBg }}; color: #0B1620; font-size: 16px; font-weight: 800">{{ followGlyph }}</button>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<button class="tonal" aria-label="Me gusta" aria-pressed="{{ likedStr }}" onClick="{{ like }}" style="background: {{ likeBg }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="{{ heartFill }}" stroke="{{ heartStroke }}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.4A4.9 4.9 0 0 1 12 7.2a4.9 4.9 0 0 1 9.3 3.9c-1.8 4.8-9.3 9.4-9.3 9.4z"></path></svg></button>
<span class="cnt">{{ likeCount }}</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<button class="tonal" aria-label="Guardar" aria-pressed="{{ savedStr }}" onClick="{{ save }}" style="background: {{ saveBg }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="{{ bmFill }}" stroke="{{ bmStroke }}" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"></path></svg></button>
<span class="cnt">Guardar</span>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<button class="tonal" aria-label="Compartir"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"></path></svg></button>
<span class="cnt">Compartir</span>
</div>
</div>

<div style="position: absolute; left: 16px; right: 84px; bottom: 212px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="height: 28px; padding: 0 10px; border-radius: 8px; background: #A4D233; color: #0B1620; font-size: 12px; font-weight: 700; letter-spacing: .06em; display: inline-flex; align-items: center">NOTICIA</span>
<span style="font-size: 14px; font-weight: 600; color: rgba(255,255,255,.9)">Agroconecta Noticias</span>
</div>
<h2 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; color: #FFFFFF">Arranca la siembra de soja con buena humedad en el este</h2>
<p style="margin: 0; font-size: 15px; line-height: 1.4; color: rgba(255,255,255,.86)">Productores de Itapúa y Alto Paraná adelantan labores tras las lluvias de la semana.</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.4); color: #FFFFFF; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center">#soja</span>
<span style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.4); color: #FFFFFF; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center">#zafra</span>
<span style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,.4); color: #FFFFFF; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center">#clima</span>
</div>
</div>

<button style="position: absolute; left: 16px; right: 16px; bottom: 132px; height: 56px; border-radius: 28px; border: 0; background: #A4D233; color: #0B1620; font-size: 16px; font-weight: 700; letter-spacing: .01em; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.3)">Ver noticia<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>

<nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 96px; padding-bottom: 16px; box-sizing: border-box; background: #151A12; display: flex; align-items: center; padding-left: 4px; padding-right: 4px">
<button class="nb" style="color: #E4EED0"><span class="ind" style="background: #3D4F14; color: #D6F08A"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7V20a.5.5 0 0 1-.5.5h-5v-6h-6v6H4a.5.5 0 0 1-.5-.5z"></path></svg></span>Inicio</button>
<button class="nb" style="color: #B7BFAA"><span class="ind"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="m15.5 8.5-2 5-5 2 2-5z"></path></svg></span>Explorar</button>
<button class="nb" aria-label="Karai" style="color: #B7BFAA"><span style="width: 56px; height: 44px; border-radius: 16px; background: #A4D233; color: #0B1620; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(0,0,0,.35)"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.7 5 2.5 6.8 7.5 7.5-5 .7-6.8 2.5-7.5 7.5-.7-5-2.5-6.8-7.5-7.5 5-.7 6.8-2.5 7.5-7.5z"></path><path d="M19 15.5c.3 2 1 2.7 3 3-2 .3-2.7 1-3 3-.3-2-1-2.7-3-3 2-.3 2.7-1 3-3z"></path></svg></span>Karai</button>
<button class="nb" style="color: #B7BFAA"><span class="ind"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h12v17l-6-4.2-6 4.2z"></path></svg></span>Guardados</button>
<button class="nb" style="color: #B7BFAA"><span class="ind"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20.5c1.5-3.8 4.4-5.5 8-5.5s6.5 1.7 8 5.5"></path></svg></span>Perfil</button>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { liked: false, saved: false, following: false };
  }
  renderVals() {
    const s = this.state;
    return {
      likedStr: String(s.liked), savedStr: String(s.saved),
      heartFill: s.liked ? '#FF5A5F' : 'none', heartStroke: s.liked ? '#FF5A5F' : '#EEF5DC',
      likeBg: s.liked ? 'rgba(255,90,95,.22)' : 'rgba(24,30,20,.62)',
      likeCount: s.liked ? '1,2 mil' : '1,2 mil',
      bmFill: s.saved ? '#0B1620' : 'none', bmStroke: s.saved ? '#0B1620' : '#EEF5DC',
      saveBg: s.saved ? '#A4D233' : 'rgba(24,30,20,.62)',
      followBg: s.following ? '#FFFFFF' : '#A4D233',
      followGlyph: s.following ? '✓' : '+',
      followLabel: s.following ? 'Dejar de seguir' : 'Seguir',
      like: () => this.setState({ liked: !s.liked }),
      save: () => this.setState({ saved: !s.saved }),
      follow: () => this.setState({ following: !s.following })
    };
  }
}
</script>
</body>
</html>
