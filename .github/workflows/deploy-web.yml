name: Deploy Web a Hostinger (desactivado — migrado a Vercel)

# Desactivado el 2026-07-03: la web se despliega ahora vía Vercel (build y deploy
# automático propio al conectar el repo, Root Directory = web). Este workflow queda
# solo para referencia — se puede correr a mano desde la pestaña Actions si hiciera
# falta volver a Hostinger.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias y build (solo web/)
        working-directory: web
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          npm ci
          npm run build

      - name: Empaquetar build standalone
        working-directory: web
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static
          cat > .next/standalone/.env <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          SERVICE_LEAD_EMAIL_TO=${{ secrets.SERVICE_LEAD_EMAIL_TO }}
          PORT=3000
          NODE_ENV=production
          EOF
          tar -czf ../deploy.tar.gz -C .next/standalone .

      - name: Subir paquete a Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: deploy.tar.gz
          target: '~/domains/agroconecta.com.py'
          overwrite: true

      - name: Desplegar y reiniciar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            set -e
            NODEJS_DIR=~/domains/agroconecta.com.py/nodejs

            rm -rf "$NODEJS_DIR"
            mkdir -p "$NODEJS_DIR"
            tar -xzf ~/domains/agroconecta.com.py/deploy.tar.gz -C "$NODEJS_DIR"
            rm -f ~/domains/agroconecta.com.py/deploy.tar.gz

            mkdir -p "$NODEJS_DIR/tmp"
            touch "$NODEJS_DIR/tmp/restart.txt"

            echo "✓ Deploy completado $(date)"
